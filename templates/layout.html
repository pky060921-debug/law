<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLANK DIMENSION</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    
    <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-main: 'DungGeunMo', sans-serif;
            --panel-color: #161b22;
            --accent-cyan: #00f3ff;
            --accent-gold: #ffd700;
        }
        body { margin:0; padding:0; background-color: #0b0d17; font-family: var(--font-main); color: #fff; }
        
        /* [신규] 로딩 바 스타일 */
        #global-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b0d17; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        .loader-ship {
            font-size: 3rem; animation: fly 1s infinite alternate;
        }
        .loader-text {
            margin-top: 20px; font-size: 1.2rem; color: var(--accent-cyan);
            animation: blink 1s infinite;
        }
        @keyframes fly { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* 픽셀 버튼 공통 */
        .pixel-btn {
            background: #21262d; border: 2px solid #fff; color: #fff;
            padding: 10px 20px; font-family: var(--font-main); cursor: pointer;
            box-shadow: 4px 4px 0px #000; transition: transform 0.1s;
            text-decoration: none; display: inline-block;
        }
        .pixel-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }
        .btn-green { border-color: #2ecc71; color: #2ecc71; }
        .btn-red { border-color: #ff4757; color: #ff4757; }
        .btn-blue { border-color: #00f3ff; color: #00f3ff; }
        
        /* 플래시 메시지 */
        .flash-msg {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 243, 255, 0.2); border: 1px solid var(--accent-cyan);
            padding: 10px 20px; border-radius: 20px; z-index: 4000;
            backdrop-filter: blur(5px); animation: fadein 0.5s;
        }
        @keyframes fadein { from { opacity:0; bottom:0; } to { opacity:1; bottom:20px; } }
    </style>
</head>
<body>
    <div id="global-loader">
        <div class="loader-ship">🚀</div>
        <div class="loader-text">WARP DRIVE ACTIVE...</div>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="flash-msg">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script>
        // 로딩바 제어
        window.addEventListener('load', function() {
            const loader = document.getElementById('global-loader');
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 500);
        });

        // 페이지 이동 시 로딩바 표시 (즉각적 반응)
        document.querySelectorAll('a, button, .planet-body').forEach(el => {
            el.addEventListener('click', function() {
                // 새 창이나 앵커 링크 제외
                if(this.target !== '_blank' && this.href && !this.href.includes('#')) {
                    document.getElementById('global-loader').style.display = 'flex';
                    document.getElementById('global-loader').style.opacity = '1';
                }
            });
        });
        
        // 플래시 메시지 자동 삭제
        setTimeout(() => {
            document.querySelectorAll('.flash-msg').forEach(e => e.style.display='none');
        }, 3000);
    </script>
</body>
</html>
