{% extends "layout.html" %}

{% block content %}
<style>
    body { background-color: #1e272e; color: #d2dae2; font-family: 'Nanum Myeongjo', serif; }
    .forge-container { max-width: 1000px; margin: 30px auto; display: flex; gap: 20px; }
    
    .editor-section { flex: 2; background: #2c3e50; padding: 20px; border-radius: 8px; border: 2px solid #f39c12; }
    .side-panel { flex: 1; background: #34495e; padding: 20px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
    
    #lawTextarea { width: 100%; height: 200px; background: #000; color: #fff; border: 1px solid #7f8c8d; padding: 15px; font-size: 1.1rem; line-height: 1.8; resize: vertical; margin-bottom: 10px; }
    
    .blank-badge { display: inline-block; background: #e74c3c; color: #fff; padding: 2px 8px; border-radius: 4px; margin: 2px; font-weight: bold; cursor: pointer; }
    .blank-badge:hover { background: #c0392b; }
    
    .option-group { background: #1e272e; padding: 15px; margin-bottom: 15px; border-radius: 6px; border-left: 4px solid #3498db; }
    .option-input { width: 100%; margin: 5px 0; padding: 8px; background: #2f3640; border: 1px solid #7f8c8d; color: #fff; }
    
    .pixel-btn { background: #f39c12; color: #fff; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; width: 100%; font-size: 1.1rem; }
    .pixel-btn:hover { background: #e67e22; }
</style>

<div class="forge-container">
    <div class="editor-section">
        <h2>🛠️ 카드 제련소 (Card Forge)</h2>
        <p style="color:#bdc3c7;">조문 텍스트를 입력하고, 마우스로 드래그하여 [빈칸 뚫기]를 누르세요.</p>
        
        <input type="text" id="mnemonicTitle" placeholder="두문자 제목 입력 (예: 대보공승)" style="width: 100%; padding: 10px; margin-bottom: 15px; font-size: 1.2rem; background: #000; color:#f1c40f; border: 1px solid #f39c12;">
        
        <div id="lawTextarea" contenteditable="true" placeholder="이곳에 조문 내용을 붙여넣으세요..."></div>
        
        <button type="button" class="pixel-btn" style="background:#27ae60;" onclick="makeBlank()">✂️ 드래그한 텍스트 빈칸 뚫기</button>
    </div>

    <div class="side-panel">
        <h3 style="margin-top:0; color:#3498db;">🎯 매력적인 오답 설계</h3>
        <p style="font-size:0.8rem; color:#aaa;">수험생이 가장 헷갈릴 만한 오답을 직접 설계하세요. 함정이 교묘할수록 높은 등급(Grade)의 카드가 됩니다.</p>
        
        <div id="optionsContainer">
            <p style="color:#7f8c8d; text-align:center;">빈칸을 먼저 뚫어주세요.</p>
        </div>
        
        <button type="button" class="pixel-btn" style="margin-top:20px;" onclick="submitCard()">✨ 카드 주조하기 (Mint Draft)</button>
    </div>
</div>

<script>
    let blanks = [];

    // 드래그한 영역을 빈칸으로 변환
    function makeBlank() {
        const selection = window.getSelection();
        const selectedText = selection.toString().trim();
        
        if (!selectedText) {
            alert("먼저 빈칸으로 만들 텍스트를 마우스로 드래그하세요.");
            return;
        }

        const blankIndex = blanks.length;
        blanks.push({ answer: selectedText, options: ['', '', ''] });
        
        // HTML 요소 교체
        const range = selection.getRangeAt(0);
        const span = document.createElement('span');
        span.className = 'blank-badge';
        span.id = `blank-badge-${blankIndex}`;
        span.innerText = `[${selectedText}]`;
        range.deleteContents();
        range.insertNode(span);
        
        renderOptionsPanel();
    }

    // 오른쪽 패널에 오답 입력 폼 렌더링
    function renderOptionsPanel() {
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        
        blanks.forEach((b, i) => {
            container.innerHTML += `
                <div class="option-group">
                    <strong style="color:#e74c3c;">정답: ${b.answer}</strong>
                    <input type="text" class="option-input" placeholder="함정 오답 1" id="opt-${i}-0">
                    <input type="text" class="option-input" placeholder="함정 오답 2" id="opt-${i}-1">
                    <input type="text" class="option-input" placeholder="함정 오답 3" id="opt-${i}-2">
                </div>
            `;
        });
    }

    // 서버로 데이터 전송 (제련)
    function submitCard() {
        const mnemonic = document.getElementById('mnemonicTitle').value.trim();
        const contentHtml = document.getElementById('lawTextarea').innerHTML;
        
        if (!mnemonic || blanks.length === 0) {
            alert("두문자 제목과 최소 1개 이상의 빈칸이 필요합니다.");
            return;
        }

        // 입력된 오답 데이터 수집
        const finalBlanks = blanks.map((b, i) => {
            return {
                answer: b.answer,
                options: [
                    document.getElementById(`opt-${i}-0`).value,
                    document.getElementById(`opt-${i}-1`).value,
                    document.getElementById(`opt-${i}-2`).value
                ].filter(opt => opt.trim() !== '') // 빈 칸 제외
            };
        });

        fetch('/api/forge/create_card', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                mnemonic_title: mnemonic,
                content_html: contentHtml,
                blanks: finalBlanks,
                zone_id: 1 // 우선 구역 1로 고정, 추후 선택 가능
            })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                alert(data.msg);
                location.href = '/lobby'; // 완료 시 차원 맵으로 이동
            } else {
                alert("에러: " + data.msg);
            }
        });
    }
</script>
{% endblock %}
